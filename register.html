<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscription AFRICASH</title><link rel="stylesheet" href="assets/style.css"></head>
<body><main class="form"><div class="brand">AFRICASH</div><h1>Créer ton compte</h1><div class="amount">Frais d'inscription : 2 500 FCFA</div>
<form action="backend/register.php" method="post">
<input name="name" placeholder="Nom complet" required><input name="phone" placeholder="Numéro Mobile Money / téléphone" required>
<input type="email" name="email" placeholder="Email (facultatif)"><input type="password" name="password" placeholder="Mot de passe" required>
<select name="country" required><option value="">Choisir le pays</option><option>Togo</option><option>Bénin</option><option>Côte d'Ivoire</option><option>Sénégal</option><option>Burkina Faso</option><option>Mali</option><option>Guinée</option><option>Cameroun</option><option>Gabon</option><option>Congo</option><option>RDC</option><option>France</option><option>Autre pays francophone</option></select>
<button class="btn" type="submit">Continuer vers le paiement</button></form>
<p class="note">Le compte doit être activé après confirmation du paiement marchand officiel.</p></main></body></html>
